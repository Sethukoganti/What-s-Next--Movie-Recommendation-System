{% set size = logo_size or 38 %}
<span class="logo-3d-mark" style="--logo-sz: {{ size }}px;" aria-hidden="true">
  <svg class="logo-3d-svg" viewBox="0 0 64 64" width="{{ size }}" height="{{ size }}" fill="none" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="pLeft-{{ logo_id|default('nb') }}" x1="8" y1="12" x2="32" y2="56" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ff0055"/>
        <stop offset="60%" stop-color="#e50914"/>
        <stop offset="100%" stop-color="#8b0000"/>
      </linearGradient>
      <linearGradient id="pRight-{{ logo_id|default('nb') }}" x1="56" y1="12" x2="32" y2="56" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffd700"/>
        <stop offset="45%" stop-color="#e50914"/>
        <stop offset="100%" stop-color="#b8001f"/>
      </linearGradient>
      <linearGradient id="pTop-{{ logo_id|default('nb') }}" x1="16" y1="8" x2="48" y2="32" gradientUnits="userSpaceOnUse">
        <stop offset="0%" stop-color="#ffffff"/>
        <stop offset="40%" stop-color="#ffd700"/>
        <stop offset="100%" stop-color="#ff0055"/>
      </linearGradient>
      <radialGradient id="pGlow-{{ logo_id|default('nb') }}" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#e50914" stop-opacity="0.45"/>
        <stop offset="100%" stop-color="#06070a" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="32" cy="32" r="28" fill="url(#pGlow-{{ logo_id|default('nb') }})"/>
    <path d="M32 6L56 19.5V44.5L32 58L8 44.5V19.5L32 6Z" fill="#0a0a12" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
    <path d="M32 6L56 19.5L32 33L8 19.5L32 6Z" fill="url(#pTop-{{ logo_id|default('nb') }})"/>
    <path d="M8 19.5L32 33V58L8 44.5V19.5Z" fill="url(#pLeft-{{ logo_id|default('nb') }})"/>
    <path d="M56 19.5L32 33V58L56 44.5V19.5Z" fill="url(#pRight-{{ logo_id|default('nb') }})"/>
    <polygon points="32,23 42,33 32,43 22,33" fill="#ffffff" opacity="0.95"/>
    <polygon points="28,27 38,33 28,39" fill="#e50914"/>
  </svg>
</span>
<span class="logo-wordmark">
  <span class="logo-wordmark__main">WHAT'S</span>
  <span class="logo-wordmark__accent">NEXT<span class="logo-wordmark__dot">.</span></span>
</span>
